name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar PDFium (verificado por SHA-256)
        shell: powershell
        run: ./scripts/setup-pdfium.ps1
      - name: Compilar
        shell: cmd
        run: scripts\build.cmd
      - name: Pruebas sin interfaz
        shell: powershell
        run: |
          $tmp = New-Item -ItemType Directory -Path "test-results/ci" -Force
          ./build/layout-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/reading-state-test.exe "$($tmp.FullName)/state"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/recent-test.exe "$($tmp.FullName)/recent"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/smoke-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-preferences.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
